<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WishWall</title>
    <link rel="stylesheet" href="../css/feed.css">
</head>
<body>

    <!-- frontend work is pending -->
    <a href="profile.html">Profile</a>
    <h4 id="Greeting"></h4>

    <div id="create-post">

        <h4>Show Your Thoughts</h4>
        <div id="image-post">
            <input type="file" id="image-input" accept="image/*">
            <input type="text" id="caption-input" placeholder="Add a caption">
            <button onclick="uploadImage()">Upload</button>
        </div>

        <h4>Share Your Thoughts</h4>
        <div id="blog-post">
            <textarea type="text" id="post-input"></textarea>
            <button id="post-btn" onclick="createPost()">Post</button>
        </div>
        

    </div>

    <div id="main-container">
        
    </div>

    <button onclick="handleLogout()">logout</button>


    <script src="../js/feed.js"></script>
</body>
</html>
